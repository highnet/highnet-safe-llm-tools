[project]
name = "highnet-core"
version = "0.1.0"
description = "Shared building blocks for Highnet Safe LLM Tools: providers, pricing, budget, trace, storage."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "anthropic>=1.0",
  "httpx>=0.27",
  "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/highnet_core"]

[project]
name = "highnet-scope"
version = "0.1.0"
description = "Scope: watch an AI agent decide whether a message is in scope, step by step."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "highnet-core",
  "fastapi>=0.115",
  "pydantic>=2.8",
  "numpy>=2.0",
]

[project.scripts]
highnet-scope = "highnet_scope.cli:main"

[tool.uv.sources]
highnet-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/highnet_scope"]

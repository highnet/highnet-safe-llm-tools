# uv workspace root: the API package and the offline evals.
[tool.uv.workspace]
members = ["core", "api", "scope", "evals"]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pytest-cov>=5.0",
]

[project]
name = "highnet-rag-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["highnet-core", "highnet-rag", "highnet-scope", "highnet-rag-evals"]

[tool.uv.sources]
highnet-core = { workspace = true }
highnet-rag = { workspace = true }
highnet-scope = { workspace = true }
highnet-rag-evals = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["highnet_core", "highnet_rag", "highnet_scope", "highnet_rag_evals", "highnet_scope_evals"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = [
  "core/src", "core/tests", "api/src", "api/tests", "scope/src", "scope/tests", "evals/src",
  "evals/tests",
]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["core/tests", "api/tests", "scope/tests", "evals/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = [
  "core/src/highnet_core",
  "api/src/highnet_rag",
  "scope/src/highnet_scope",
  "evals/src/highnet_rag_evals",
  "evals/src/highnet_scope_evals",
]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ['if __name__ == "__main__":']

name: Record demo questions

# RAG: records every demo question (recordings/questions.json) at every setting with the real
# models and uploads data/recordings.sqlite to the Fly volume (about $6.50 for the full grid, once).
# It resumes: settings already on the volume are skipped, and progress is uploaded even if the job
# stops.
# Scope: records the example messages (recordings/scope/examples.json) that are not yet recorded
# into recordings/scope/scope.sqlite (about $0.17 for all 80 from scratch), uploads it to the
# volume and pushes it to a new branch for review, since the committed file is the source of truth.
# Both call paid APIs, so they only run by hand; visitors only ever replay.
on:
  workflow_dispatch:
    inputs:
      product:
        description: Which product to record
        type: choice
        options: [rag, scope]
        default: rag
      only:
        description: Only these question or example ids, comma-separated (empty = all)
        default: ""

permissions:
  contents: write

concurrency: record

jobs:
  record:
    name: Record RAG
    if: inputs.product == 'rag'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      ANTHROPIC_MAX_RETRIES: "8"
      VOYAGE_MAX_RETRIES: "8"
      VOYAGE_MAX_RETRY_WAIT_SECONDS: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - name: Download the live corpus
        run: scripts/download-corpus.sh data/corpus.sqlite
      - name: Download earlier recordings, if any (the run resumes)
        run: scripts/download-corpus.sh data/recordings.sqlite recordings.sqlite || rm -f data/recordings.sqlite
      - name: Smoke test (one question; stops on any failure)
        run: uv run highnet-rag record --corpus data/corpus.sqlite --only normandy
      - name: Record
        run: |
          uv run highnet-rag record --corpus data/corpus.sqlite --concurrency 4 \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} | tee record.log
      - name: Upload the recordings to the volume (also after a failure, to keep progress)
        if: always()
        run: |
          [ -f data/recordings.sqlite ] && scripts/upload-corpus.sh data/recordings.sqlite recordings.sqlite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recordings
          path: |
            data/recordings.sqlite
            record.log

  record-scope:
    name: Record Scope
    if: inputs.product == 'scope'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      ANTHROPIC_MAX_RETRIES: "8"
      VOYAGE_MAX_RETRIES: "8"
      STATE_DB_PATH: /tmp/state.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - name: Load the example list into the database (no model calls)
        run: |
          uv run python -c "from pathlib import Path; from highnet_scope.ingest import load_examples; from highnet_scope.store import ScopeStore; ScopeStore(Path('recordings/scope/scope.sqlite')).save_examples(load_examples())"
      - name: Record (calls already recorded are reused, so only new ones are paid)
        run: |
          uv run highnet-scope record --db recordings/scope/scope.sqlite \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} | tee record-scope.log
      - name: Re-export the dataset and RAG verdicts for the web app
        run: uv run highnet-scope export --db recordings/scope/scope.sqlite
      - name: Upload to the volume
        run: scripts/upload-corpus.sh recordings/scope/scope.sqlite scope.sqlite
      - name: Push the recordings to a branch for review
        run: |
          branch="scope/record-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add recordings/scope/scope.sqlite web/public/scope/dataset.json web/lib/generated/scope-verdicts.json
          git commit -m "Scope recordings from run ${{ github.run_id }}" -m "$(tail -n 6 record-scope.log)"
          git push origin "$branch"
          echo "Pushed $branch" >> "$GITHUB_STEP_SUMMARY"

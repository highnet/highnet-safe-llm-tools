name: Evals

# Runs the offline evals against the live corpus with the real models, then pushes the results
# to a new branch (evals/run-<id>) for review. By default it measures retrieval only (Voyage
# calls, a few cents); `full` adds answers graded by the judge (about $2.50 to $3.50). It only
# runs by hand, and eval spend is not counted against the visitor budget.
on:
  workflow_dispatch:
    inputs:
      product:
        description: Which product's evals to run (Scope's judge pass costs about $0.78)
        type: choice
        options: [rag, scope]
        default: rag
      limit:
        description: Only the first N questions per golden set (0 = all)
        default: "0"
      full:
        description: Also generate and grade answers (about $2.50 to $3.50)
        type: boolean
        default: false

permissions:
  contents: write

concurrency: evals

jobs:
  evals:
    name: Run RAG evals
    if: inputs.product == 'rag'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      # Patient retries: one rate-limited call should not turn into a failed question.
      ANTHROPIC_MAX_RETRIES: "8"
      VOYAGE_MAX_RETRIES: "8"
      VOYAGE_MAX_RETRY_WAIT_SECONDS: "30"
      SCOPE: ${{ inputs.full && ' ' || '--retrieval-only' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - name: Download the live corpus
        run: scripts/download-corpus.sh data/corpus.sqlite
      - name: Smoke test (one question per set; stops on any error)
        run: |
          uv run highnet-rag-evals run --corpus data/corpus.sqlite --out /tmp/smoke --limit 1 $SCOPE
          jq -e '[.retrieval.configs[].errors, .answers.answerable.errors // 0,
                  .answers.unanswerable.errors // 0, (.compound // [])[].errors] | add == 0' \
            /tmp/smoke/latest.json
      - name: Run the evals
        run: |
          uv run highnet-rag-evals run --corpus data/corpus.sqlite --limit "${{ inputs.limit }}" \
            --concurrency 4 $SCOPE | tee evals-run.log
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results/
            evals-run.log
      - name: Push the results to a branch
        run: |
          branch="evals/run-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add evals/results
          git commit -m "Eval results from run ${{ github.run_id }}" \
            -m "$(tail -n 8 evals-run.log)"
          git push origin "$branch"
          echo "Pushed $branch" >> "$GITHUB_STEP_SUMMARY"

  scope-evals:
    name: Run Scope evals
    if: inputs.product == 'scope'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      ANTHROPIC_MAX_RETRIES: "8"
      VOYAGE_MAX_RETRIES: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - name: Smoke test (one prompt per preset)
        run: |
          uv run highnet-scope-evals run --db recordings/scope/scope.sqlite --out /tmp/smoke \
            --cache /tmp/smoke-cache.sqlite --limit 1
      - name: Run the evals over every labeled prompt
        run: |
          uv run highnet-scope-evals run --db recordings/scope/scope.sqlite \
            --limit "${{ inputs.limit }}" --concurrency 6 | tee scope-evals.log
      - name: Push the results to a branch
        run: |
          branch="evals/scope-run-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add evals/results/scope
          git commit -m "Scope eval results from run ${{ github.run_id }}" -m "$(tail -n 8 scope-evals.log)"
          git push origin "$branch"
          echo "Pushed $branch" >> "$GITHUB_STEP_SUMMARY"
